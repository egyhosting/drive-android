#
# Builds the EgyHosting Drive Android app (flavor "egyhosting").
#   - debug APK: always, signed with the debug key, for installing on test phones
#   - release AAB + APK: signed with the upload key when the repository secrets exist
# Upstream Nextcloud workflows are parked in .github/upstream-workflows-disabled.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   EGD_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   EGD_KEYSTORE_PASSWORD keystore password
#   EGD_KEY_ALIAS         key alias
#   EGD_KEY_PASSWORD      key password

name: EgyHosting Drive build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egd-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gradle settings
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Restore upload keystore
        id: keystore
        env:
          EGD_KEYSTORE_BASE64: ${{ secrets.EGD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$EGD_KEYSTORE_BASE64" ]; then
            echo "$EGD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/egd-upload.jks"
            echo "file=$RUNNER_TEMP/egd-upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret: release outputs will be unsigned."
          fi

      - name: Build
        env:
          EGD_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          EGD_KEYSTORE_PASSWORD: ${{ secrets.EGD_KEYSTORE_PASSWORD }}
          EGD_KEY_ALIAS: ${{ secrets.EGD_KEY_ALIAS }}
          EGD_KEY_PASSWORD: ${{ secrets.EGD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleEgyhostingDebug assembleEgyhostingRelease bundleEgyhostingRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/egd-upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: egyhosting-drive-debug-apk
          path: app/build/outputs/apk/egyhosting/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: egyhosting-drive-release
          path: |
            app/build/outputs/apk/egyhosting/release/*.apk
            app/build/outputs/bundle/egyhostingRelease/*.aab
          retention-days: 30
